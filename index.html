<style>
@import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Pacifico&display=swap');

:root {
    --bg: #f5f7fb;
    --surface: rgba(255,255,255,.88);
    --surface-solid: #ffffff;
    --text: #172033;
    --muted: #697386;
    --accent: #ff6b35;
    --accent-2: #6c63ff;
    --line: rgba(23,32,51,.09);
    --shadow: 0 12px 35px rgba(24,34,56,.10);
}

* { box-sizing: border-box; }

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    min-height: 100vh;
    font-family: 'Nunito', 'Segoe UI', sans-serif;
    color: var(--text);
    background:
        radial-gradient(circle at 10% 10%, rgba(255,107,53,.18), transparent 30%),
        radial-gradient(circle at 90% 15%, rgba(108,99,255,.17), transparent 30%),
        linear-gradient(180deg, #eef3ff 0%, #f8fafc 42%, #ffffff 100%);
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(circle at 20% 80%, rgba(32,201,151,.08), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(255,193,7,.08), transparent 25%);
    z-index: -1;
}

.page {
    width: min(1500px, calc(100% - 32px));
    margin: 0 auto;
    padding: 22px 0 55px;
}

.hero {
    position: relative;
    overflow: hidden;
    display: grid;
    grid-template-columns: 110px 1fr 110px;
    align-items: center;
    gap: 20px;
    min-height: 190px;
    padding: 28px 38px;
    border: 1px solid rgba(255,255,255,.75);
    border-radius: 30px;
    background:
        linear-gradient(135deg, rgba(255,255,255,.94), rgba(255,255,255,.70)),
        linear-gradient(120deg, #ffd1dc, #91eae4);
    box-shadow: var(--shadow);
    backdrop-filter: blur(12px);
}

.hero::after {
    content: "";
    position: absolute;
    width: 300px;
    height: 300px;
    right: -100px;
    top: -150px;
    border-radius: 50%;
    background: rgba(108,99,255,.14);
}

.hero-logo {
    width: 100px;
    height: 100px;
    object-fit: contain;
    justify-self: center;
    filter: drop-shadow(0 8px 10px rgba(0,0,0,.12));
    transition: transform .3s ease;
}

.hero-logo:hover {
    transform: translateY(-4px) rotate(3deg) scale(1.04);
}

.hero-center {
    position: relative;
    z-index: 1;
    text-align: center;
}

.hero-title {
    margin: 0;
    font-size: clamp(2rem, 4vw, 3.6rem);
    font-weight: 900;
    letter-spacing: -.04em;
    line-height: 1;
}

.hero-script {
    margin: 8px 0 5px;
    font-family: 'Pacifico', cursive;
    font-size: clamp(1.2rem, 2.5vw, 2rem);
    color: var(--accent);
}

.hero-subtitle {
    margin: 0;
    color: var(--muted);
    font-weight: 700;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-size: .78rem;
}

.toolbar {
    position: sticky;
    top: 12px;
    z-index: 20;
    margin: 22px 0 28px;
    padding: 13px 15px;
    border: 1px solid rgba(255,255,255,.8);
    border-radius: 20px;
    background: rgba(255,255,255,.82);
    backdrop-filter: blur(18px);
    box-shadow: 0 10px 28px rgba(24,34,56,.08);
}

.year-selector {
    display: flex;
    align-items: center;
    justify-content: center;
    flex-wrap: wrap;
    gap: 7px;
}

.year-button {
    appearance: none;
    border: 1px solid transparent;
    border-radius: 999px;
    padding: 9px 15px;
    min-width: 55px;
    background: #f0f3f8;
    color: #4c566a;
    font: inherit;
    font-size: .86rem;
    font-weight: 800;
    cursor: pointer;
    transition: transform .18s ease, background .18s ease, color .18s ease, box-shadow .18s ease;
}

.year-button:hover {
    transform: translateY(-2px);
    background: #e5eaf3;
}

.year-button.selected {
    color: #fff;
    background: linear-gradient(135deg, var(--accent), #ff914d);
    box-shadow: 0 7px 18px rgba(255,107,53,.27);
}

.year-button[data-year="2008-2013"] {
    min-width: 78px;
}

.section-heading {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 15px;
    margin: 0 4px 16px;
}

.section-heading h2 {
    margin: 0;
    font-size: 1.25rem;
}

#videoCount {
    color: var(--muted);
    font-size: .85rem;
    font-weight: 700;
}

.video-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(235px, 1fr));
    gap: 20px;
}

.video-card {
    position: relative;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: 20px;
    background: var(--surface-solid);
    box-shadow: 0 7px 24px rgba(24,34,56,.08);
    transition: transform .25s ease, box-shadow .25s ease;
    animation: cardIn .35s ease both;
}

.video-card:hover {
    transform: translateY(-7px);
    box-shadow: 0 18px 38px rgba(24,34,56,.15);
}

.video-link {
    position: relative;
    display: block;
    aspect-ratio: 16 / 10;
    overflow: hidden;
    background: #e9edf4;
}

.video-thumbnail {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: transform .45s ease;
}

.video-card:hover .video-thumbnail {
    transform: scale(1.06);
}

.play {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 54px;
    height: 54px;
    display: grid;
    place-items: center;
    transform: translate(-50%, -50%) scale(.9);
    border-radius: 50%;
    color: #fff;
    background: rgba(17,24,39,.72);
    box-shadow: 0 7px 18px rgba(0,0,0,.22);
    opacity: .88;
    transition: transform .25s ease, background .25s ease;
}

.play::after {
    content: "";
    margin-left: 4px;
    border-left: 16px solid #fff;
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
}

.video-card:hover .play {
    transform: translate(-50%, -50%) scale(1);
    background: rgba(255,59,48,.92);
}

.video-info {
    padding: 15px 16px 16px;
}

.video-title {
    margin: 0 0 7px;
    color: var(--text);
    font-size: 1rem;
    line-height: 1.25;
    font-weight: 900;
}

.video-description {
    min-height: 42px;
    color: var(--muted);
    font-size: .82rem;
    line-height: 1.45;
}

.centered-squares {
    margin-top: 9px;
    color: #b9c0cc;
    font-size: .58rem;
    letter-spacing: 4px;
    text-align: center;
}

.year-badge {
    position: absolute;
    left: 12px;
    top: 12px;
    padding: 5px 9px;
    border-radius: 999px;
    color: #fff;
    background: rgba(17,24,39,.72);
    backdrop-filter: blur(8px);
    font-size: .72rem;
    font-weight: 900;
}

.empty {
    display: none;
    padding: 50px 20px;
    text-align: center;
    color: var(--muted);
}

.footer {
    margin-top: 45px;
    text-align: center;
    color: #8b94a5;
    font-size: .78rem;
}

.close-page {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 50;
    width: 46px;
    height: 46px;
    border: 0;
    border-radius: 50%;
    background: rgba(17,24,39,.86);
    color: #fff;
    font-size: 1rem;
    font-weight: 900;
    cursor: pointer;
    box-shadow: 0 8px 22px rgba(0,0,0,.2);
    transition: transform .2s ease, background .2s ease;
}

.close-page:hover {
    transform: scale(1.08);
    background: #ef4444;
}

.mascot {
    position: fixed;
    bottom: 18px;
    z-index: 10;
    pointer-events: none;
    opacity: .94;
}

.mascot img {
    display: block;
    width: 82px;
    max-height: 120px;
    object-fit: contain;
    animation: float 3.2s ease-in-out infinite;
    filter: drop-shadow(0 8px 8px rgba(0,0,0,.12));
}

.mascot-left { left: 18px; }
.mascot-right { right: 78px; }

@keyframes float {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-9px); }
}

@keyframes cardIn {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 900px) {
    .hero {
        grid-template-columns: 80px 1fr 80px;
        padding: 22px;
        min-height: 150px;
    }
    .hero-logo { width: 72px; height: 72px; }
    .video-grid {
        grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
        gap: 15px;
    }
    .mascot img { width: 65px; }
}

@media (max-width: 600px) {
    .page {
        width: min(100% - 18px, 520px);
        padding-top: 9px;
    }
    .hero {
        grid-template-columns: 1fr;
        gap: 8px;
        padding: 22px 16px;
        border-radius: 24px;
    }
    .hero-logo {
        display: none;
    }
    .hero-title {
        font-size: 2rem;
    }
    .hero-script {
        font-size: 1.35rem;
    }
    .toolbar {
        top: 6px;
        margin: 12px 0 20px;
        padding: 10px;
        border-radius: 17px;
    }
    .year-selector {
        gap: 5px;
    }
    .year-button {
        padding: 8px 12px;
        min-width: 49px;
        font-size: .78rem;
    }
    .video-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 11px;
    }
    .video-card {
        border-radius: 15px;
    }
    .video-info {
        padding: 11px;
    }
    .video-title {
        font-size: .88rem;
    }
    .video-description {
        font-size: .72rem;
        min-height: 38px;
    }
    .play {
        width: 44px;
        height: 44px;
    }
    .play::after {
        border-left-width: 13px;
        border-top-width: 8px;
        border-bottom-width: 8px;
    }
    .mascot {
        display: none;
    }
    .close-page {
        width: 42px;
        height: 42px;
        right: 10px;
        bottom: 10px;
    }
}

@media (max-width: 380px) {
    .video-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>

    const grid = document.getElementById("videoGrid");
    const empty = document.getElementById("empty");
    const count = document.getElementById("videoCount");
    const selectedYear = document.getElementById("selectedYear");
    const buttons = document.querySelectorAll(".year-button");

    function render(year) {
        grid.innerHTML = "";

        const selected = year === "2008-2013"
            ? videos.filter(v => v.year >= 2008 && v.year <= 2013)
            : videos.filter(v => v.year === Number(year));

        selected.forEach((video, index) => {
            const card = document.createElement("article");
            card.className = "video-card";
            card.style.animationDelay = `${Math.min(index * 35, 300)}ms`;

            const oldYear = video.year >= 2008 && video.year <= 2013
                ? `<span class="year-badge">${video.year}</span>`
                : "";

            card.innerHTML = `
                <a class="video-link" href="${video.link}" target="_blank" rel="noopener">
                    <img src="${video.imgSrc}" alt="${video.title}" class="video-thumbnail" loading="lazy">
                    <span class="play" aria-hidden="true"></span>
                    ${oldYear}
                </a>
                <div class="video-info">
                    <h3 class="video-title">${video.title}</h3>
                    <div class="video-description">
                        ${video.description}
                        <div class="centered-squares">● ● ●</div>
                    </div>
                </div>
            `;
            grid.appendChild(card);
        });

        empty.style.display = selected.length ? "none" : "block";
        count.textContent = `${selected.length} video${selected.length > 1 ? "s" : ""}`;
        selectedYear.textContent = year === "2008-2013"
            ? "Memories from 2008–2013"
            : `Memories from ${year}`;
    }

    buttons.forEach(button => {
        button.addEventListener("click", () => {
            buttons.forEach(b => b.classList.remove("selected"));
            button.classList.add("selected");
            render(button.dataset.year);
            window.scrollTo({ top: 0, behavior: "smooth" });
        });
    });

    document.querySelector(".close-page").addEventListener("click", () => {
        window.close();
    });

    render("2026");
});
</script>
